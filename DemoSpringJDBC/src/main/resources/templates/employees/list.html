<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Danh sách nhân viên')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="container">
    <h3>Danh sách nhân viên</h3>
    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

    <!-- Form tìm kiếm -->
    <form class="row g-2 mb-3" method="get" th:action="@{/employees}" th:object="${criteria}">
        <div class="col-md-1">
            <input class="form-control" placeholder="ID" th:field="*{id}" type="number">
        </div>
        <div class="col-md-3">
            <input class="form-control" placeholder="Tên chứa..." th:field="*{name}">
        </div>
        <div class="col-md-1">
            <input class="form-control" placeholder="Tuổi từ" th:field="*{minAge}" type="number">
        </div>
        <div class="col-md-1">
            <input class="form-control" placeholder="đến" th:field="*{maxAge}" type="number">
        </div>
        <div class="col-md-2">
            <input class="form-control" placeholder="Lương &gt;" step="any" th:field="*{minSalary}" type="number">
        </div>
        <div class="col-md-2">
            <select class="form-select" th:field="*{positionId}">
                <option value="">-- Chức vụ --</option>
                <option th:each="p : ${positions}" th:text="${p.title}" th:value="${p.id}"></option>
            </select>
        </div>
        <div class="col-md-2 d-flex gap-2">
            <button class="btn btn-primary flex-fill">Tìm</button>
            <a class="btn btn-outline-secondary" th:href="@{/employees}">Xóa lọc</a>
        </div>
    </form>

    <p class="text-muted" th:if="${searching}">
        Tìm thấy <b th:text="${#lists.size(employees)}"></b> kết quả.
    </p>

    <p class="text-muted" th:if="${#lists.isEmpty(employees)}">Không có nhân viên nào.</p>

    <table class="table table-striped table-sm align-middle" th:unless="${#lists.isEmpty(employees)}">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Họ tên</th>
            <th>Vai trò</th>
            <th>Tuổi</th>
            <th>Lương</th>
            <th>Phòng ban</th>
            <th>Chức vụ</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="e : ${employees}">
            <td th:text="${e.id}"></td>
            <td><a th:href="@{/employees/{id}(id=${e.id})}" th:text="${e.name}"></a></td>
            <td th:text="${e.role}"></td>
            <td th:text="${e.age}"></td>
            <td th:text="${#numbers.formatDecimal(e.salary, 0, 'COMMA', 0, 'POINT')}"></td>
            <td th:text="${e.departmentName}"></td>
            <td th:text="${e.positionTitle}"></td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-primary" th:href="@{/employees/{id}/edit(id=${e.id})}">Sửa</a>
                <form class="d-inline" method="post" onsubmit="return confirm('Xóa nhân viên này?')"
                      th:action="@{/employees/{id}/delete(id=${e.id})}">
                    <button class="btn btn-sm btn-outline-danger">Xóa</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
